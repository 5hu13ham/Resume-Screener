name: Portfolio Demo CI

on:
  push:
    branches:
      - "feature/**"
      - "cursor/**"
      - main
  pull_request:

jobs:
  build-and-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      DEMO_MODE: "true"
      DEMO_SESSION_SECRET: "ci-only-long-synthetic-secret-for-demo-checks-2026"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Start Next.js server
        run: |
          nohup npm run start > /tmp/screener-ci.log 2>&1 &
          for n in $(seq 1 45); do
            if curl -fsS http://localhost:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/screener-ci.log
          exit 1
      - name: Verify demo and security boundaries
        run: |
          npm run verify:demo
          node scripts/verify-demo-security.mjs
      - name: Show server logs on failure
        if: failure()
        run: tail -100 /tmp/screener-ci.log || true
